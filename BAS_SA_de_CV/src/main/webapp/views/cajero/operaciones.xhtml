<ui:composition template="/views/templates/layout.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets">

    <ui:define name="title">Operaciones de Caja - BAS</ui:define>

    <ui:define name="sidebar-menu">
        <h:link outcome="/views/cajero/dashboard.xhtml" styleClass="nav-link">
            <span><i data-lucide="home" class="sidebar-icon"></i></span> Dashboard
        </h:link>
        <h:link outcome="/views/cajero/registro.xhtml" styleClass="nav-link">
            <span><i data-lucide="users" class="sidebar-icon"></i></span> Registro Usuarios
        </h:link>
        <h:link outcome="/views/cajero/operaciones.xhtml" styleClass="nav-link active">
            <span><i data-lucide="banknote" class="sidebar-icon"></i></span> Operaciones Caja
        </h:link>
        <h:link outcome="/views/cajero/prestamos.xhtml" styleClass="nav-link">
            <span><i data-lucide="file-text" class="sidebar-icon"></i></span> Préstamos
        </h:link>
    </ui:define>

    <ui:define name="content">
        <h2 style="font-size: 1.5rem; font-weight: 700; margin-bottom: 1.5rem;">Operaciones de Caja (Depósitos / Retiros)</h2>
        
        <div class="card" style="max-width: 600px;">
            <div class="card-title">Realizar Transacción</div>
            <h:form>
                <div class="form-group">
                    <h:outputLabel value="DUI del Cliente Presente" styleClass="form-label"/>
                    <h:inputText value="#{cajeroBean.operacionDui}" required="true" styleClass="form-control mascara-dui" requiredMessage="El DUI es requerido para validar la propiedad de la cuenta"/>
                </div>

                <div class="form-group">
                    <h:outputLabel value="Número de Cuenta" styleClass="form-label"/>
                    <h:inputText value="#{cajeroBean.operacionCuenta}" required="true" styleClass="form-control" />
                </div>

                <div class="form-group">
                    <h:outputLabel value="Monto ($)" styleClass="form-label"/>
                    <h:inputText value="#{cajeroBean.operacionMonto}" required="true" styleClass="form-control mascara-monto">
                        <f:convertNumber pattern="#0.00" />
                    </h:inputText>
                </div>
                
                <div class="flex gap-4 mt-4">
                    <h:commandButton value="Depósito" action="#{cajeroBean.realizarDeposito}" styleClass="btn btn-success" style="flex: 1;" />
                    <h:commandButton value="Retiro" action="#{cajeroBean.realizarRetiro}" styleClass="btn btn-primary" style="flex: 1; background: var(--danger);" />
                </div>
            </h:form>
        </div>
    </ui:define>
</ui:composition>
